name: Deploy DB viewer to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "db-viewer/**"
      - "planning/combined-pilot/**"
      - "transcript-eval/**"
      - "outputs/01a05c37-c522-7563-8846-1ea43a7a49d5/База пилота автоматизации критериев ТюмГУ.sqlite"
      - "outputs/01a05c37-c522-7563-8846-1ea43a7a49d5/ERD базы пилота автоматизации критериев ТюмГУ.svg"
      - "outputs/01a05c37-c522-7563-8846-1ea43a7a49d5/ERD базы пилота автоматизации критериев ТюмГУ.mmd"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install static renderer
        run: python3 -m pip install -r db-viewer/requirements.txt
      - name: Build static snapshot
        run: python3 db-viewer/build_static.py --output _site
      - name: Check public snapshot
        run: python3 db-viewer/check_public_site.py --site _site
      - name: Check static builder regressions
        run: python3 -m unittest discover -s db-viewer/tests -p test_static_build.py
      - name: Check transcript tool without external requests
        run: python3 -m unittest discover -s transcript-eval/tests
      - name: Check research audit fidelity
        run: python3 planning/combined-pilot/audit/check_audit.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
